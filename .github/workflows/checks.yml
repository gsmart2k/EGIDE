name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - run: npm test --prefix apps/dashboard
      - run: npm ci --prefix packages/sdk
      - run: npm test --prefix packages/sdk
      - run: npm run typecheck --prefix packages/sdk
      - run: cargo test --locked --manifest-path contracts/vault/Cargo.toml
